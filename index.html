<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="theme-color" content="#07070f"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="manifest" href="manifest.json"/>
  <title>Merge Grid</title>
  <style>@font-face{font-family:Orbitron;font-weight:700;src:url(fonts/orbitron-latin-700-normal.woff2) format("woff2");}@font-face{font-family:Orbitron;font-weight:900;src:url(fonts/orbitron-latin-900-normal.woff2) format("woff2");}</style>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#07070f;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;font-family:'Orbitron','Courier New',monospace;}
    #root{min-height:100dvh;background:radial-gradient(ellipse at 20% 20%,#1a0030 0%,#07070f 40%,#000b1a 100%);display:flex;flex-direction:column;align-items:center;padding:12px;user-select:none;touch-action:manipulation;}
    .header{width:100%;max-width:380px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-top:4px;}
    h1{font-size:22px;font-weight:900;letter-spacing:.15em;background:linear-gradient(90deg,#FF3CAC,#00D4FF,#3BFF73);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .maxlabel{font-size:10px;color:#ffffffcc;letter-spacing:.2em;}
    .players{display:flex;gap:8px;width:100%;max-width:380px;margin-bottom:14px;}
    .player{flex:1;border-radius:14px;padding:10px 12px;transition:all .3s;}
    .player.active{background:linear-gradient(135deg,rgba(0,212,255,.12),rgba(120,77,255,.12));border:1.5px solid #00D4FF33;box-shadow:0 0 24px rgba(0,212,255,.1);}
    .player.inactive{background:rgba(255,255,255,.03);border:1.5px solid #ffffff0f;}
    .phead{display:flex;justify-content:space-between;align-items:baseline;}
    .pname{font-size:11px;letter-spacing:.12em;}
    .active .pname{color:#00D4FF;}.inactive .pname{color:#ffffffcc;}
    .pbest{font-size:9px;color:#ffffffcc;letter-spacing:.1em;}
    .pscore{font-size:28px;font-weight:900;line-height:1.1;margin-top:2px;}
    .active .pscore{color:#fff;text-shadow:0 0 20px rgba(0,212,255,.5);}.inactive .pscore{color:#ffffffdd;}
    .hand{display:flex;gap:3px;margin-top:8px;flex-wrap:wrap;}
    .htile{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:-.02em;}
    .htile.next{animation:pulse 1.4s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
    .grid-wrap{padding:10px;border-radius:18px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.06);box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);position:relative;overflow:hidden;}
    .grid-dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1px);background-size:16px 16px;pointer-events:none;}
    .grid{display:grid;grid-template-columns:repeat(5,64px);gap:6px;position:relative;}
    .cell{width:64px;height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;letter-spacing:-.02em;cursor:pointer;position:relative;overflow:hidden;}
    .cell .shine{position:absolute;top:0;left:0;right:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.18) 0%,transparent 100%);border-radius:12px 12px 0 0;pointer-events:none;}
    .cell:active{transform:scale(.93);}

    /* Merge: losers shrink to nothing */
    .cell.merging{animation:mergeShrink .32s ease-in forwards;pointer-events:none;}
    @keyframes mergeShrink{0%{transform:scale(1);opacity:1;filter:brightness(1.5);}50%{transform:scale(1.15);filter:brightness(2);}100%{transform:scale(0);opacity:0;}}

    /* Merge: winner pops in with new value */
    .cell.merge-winner{animation:mergeWin .4s cubic-bezier(.17,.67,.35,1.5) forwards;}
    @keyframes mergeWin{0%{transform:scale(0);opacity:0;filter:brightness(3);}55%{transform:scale(1.4);filter:brightness(2);}80%{transform:scale(0.9);}100%{transform:scale(1);opacity:1;filter:brightness(1);}}

    /* New tiles fall from top */
    .cell.falling{animation:fallIn .42s cubic-bezier(.4,0,.2,1) forwards;}
    @keyframes fallIn{from{transform:translateY(-320px);opacity:0;}to{transform:translateY(0);opacity:1;}}

    /* Existing tiles slide down after collapse */
    .cell.dropping{animation:dropDown .22s ease-out forwards;}
    @keyframes dropDown{from{transform:translateY(-70px);}to{transform:translateY(0);}}

    .hint{margin-top:12px;text-align:center;min-height:50px;font-size:11px;color:#ffffffdd;letter-spacing:.1em;}
    .modval{font-weight:900;}
    .restart-btn{margin-top:8px;padding:6px 18px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,.5);color:#ffffffdd;font-size:10px;cursor:pointer;letter-spacing:.12em;text-transform:uppercase;font-family:'Orbitron',monospace;}
    .gameover-title{font-size:20px;font-weight:900;letter-spacing:.1em;background:linear-gradient(90deg,#3BFF73,#00D4FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .gameover-scores{font-size:11px;color:#ffffffdd;margin-top:4px;letter-spacing:.08em;}
    .play-again{margin-top:12px;padding:10px 32px;border-radius:10px;background:linear-gradient(135deg,rgba(255,60,172,.22),rgba(0,212,255,.22));border:1.5px solid #00D4FF88;color:#00D4FF;font-size:12px;font-weight:700;letter-spacing:.15em;cursor:pointer;text-transform:uppercase;font-family:'Orbitron',monospace;box-shadow:0 0 20px rgba(0,212,255,.2);}
    .score-pop{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);font-size:52px;font-weight:900;color:#FFD23F;font-family:'Orbitron',monospace;text-shadow:0 0 30px #FFD23F,0 0 60px #FF9500;animation:scorePop 1.1s ease-out forwards;pointer-events:none;z-index:999;}
    @keyframes scorePop{0%{opacity:1;transform:translate(-50%,-50%) scale(1);}40%{opacity:1;transform:translate(-50%,-85%) scale(1.35);}100%{opacity:0;transform:translate(-50%,-130%) scale(.7);}}
    .overlay{position:fixed;inset:0;background:rgba(3,3,10,.96);display:flex;flex-direction:column;align-items:center;gap:12px;z-index:50;padding:20px 16px;overflow-y:auto;}
    .overlay[hidden]{display:none;}
    .overlay>*:first-child{margin-top:auto;}.overlay>*:last-child{margin-bottom:auto;}
    .overlay h2{font-size:24px;font-weight:900;color:#fff;letter-spacing:.15em;margin-bottom:6px;text-shadow:0 0 18px #00D4FF;}
    .overlay button{font-family:'Orbitron',monospace;cursor:pointer;color:#fff;letter-spacing:.08em;}
    .big{width:260px;padding:16px;border-radius:14px;font-size:15px;font-weight:700;background:#00D4FF22;border:2px solid #00D4FF;box-shadow:0 0 14px #00D4FF66;}
    .big.p2{background:#FF3CAC22;border-color:#FF3CAC;box-shadow:0 0 14px #FF3CAC66;}
    .big .sub{font-size:11px;color:#fff;margin-top:6px;}
    .small{padding:10px 16px;border-radius:10px;font-size:11px;font-weight:700;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.6);}
    .srow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
    .slabel{font-size:11px;color:#FFD23F;letter-spacing:.12em;margin-top:6px;}
    .chip{padding:8px 12px;border-radius:9px;font-size:11px;font-weight:700;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.45);}
    .chip.on{background:#3BFF7333;border-color:#3BFF73;box-shadow:0 0 10px #3BFF7366;}
    .stats{font-size:11px;color:#fff;text-align:center;line-height:1.8;letter-spacing:.06em;margin-top:6px;}
    .howto{max-width:360px;font-family:system-ui,sans-serif;font-size:15px;line-height:1.5;color:#fff;}
    .howto p{margin-bottom:12px;}
    .mini{display:inline-block;width:26px;height:26px;border-radius:6px;text-align:center;line-height:26px;font-weight:700;font-family:'Orbitron',monospace;font-size:13px;margin:0 1px;}
    .callout{position:fixed;top:24%;left:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#E040FB;font-family:'Orbitron',monospace;text-shadow:0 0 24px #E040FB;animation:scorePop 1.1s ease-out forwards;pointer-events:none;z-index:999;white-space:nowrap;}
    .undo{border-color:#FFD23F!important;color:#FFD23F!important;}
  </style>
</head>
<body>
<div id="root">
  <div class="header"><h1>MERGE GRID</h1><div class="maxlabel" id="maxlabel">MAX 5</div></div>
  <div class="players" id="players"></div>
  <div class="grid-wrap"><div class="grid-dots"></div><div class="grid" id="grid"></div></div>
  <div class="hint" id="hint"></div>
</div>
<div id="menu" class="overlay"></div>
<div id="how" class="overlay" hidden></div>
<div id="settings" class="overlay" hidden></div>
<script>
const GS=5;
const PAL={0:{bg:"#111122",glow:"transparent",text:"#222244"},1:{bg:"#FF3CAC",glow:"#FF3CAC",text:"#fff"},2:{bg:"#FF6B35",glow:"#FF6B35",text:"#fff"},3:{bg:"#FFD23F",glow:"#FFD23F",text:"#1a1a00"},4:{bg:"#3BFF73",glow:"#3BFF73",text:"#001a00"},5:{bg:"#00D4FF",glow:"#00D4FF",text:"#001a22"},6:{bg:"#784DFF",glow:"#784DFF",text:"#fff"},7:{bg:"#FF4D6D",glow:"#FF4D6D",text:"#fff"},8:{bg:"#FF9500",glow:"#FF9500",text:"#1a0800"},9:{bg:"#00FFD1",glow:"#00FFD1",text:"#001a13"},10:{bg:"#E040FB",glow:"#E040FB",text:"#fff"}};
const MC={"+1":"#3BFF73","-1":"#FF6B35","+2":"#00D4FF","-2":"#FF3CAC","+3":"#FFD23F","-3":"#FF4D6D","×2":"#E040FB","💣":"#FF9500"};
function gp(v){return PAL[Math.min(v,10)]||PAL[10];}
function cl(t){return t==='x2'?'×2':t==='bomb'?'💣':(t>0?'+'+t:''+t);}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function load(k,d){try{return Object.assign({},d,JSON.parse(localStorage.getItem(k)||'{}'));}catch(e){return Object.assign({},d);}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const DEF={winBy:'score',combos:true,length:9,threes:true,power:true,diff:'medium',sound:true,buzz:true};
let S=load('mg_settings',DEF);
let ST=load('mg_stats',{best1p:0,easy:[0,0],medium:[0,0],hard:[0,0]});

// Card odds: ±1 ≈45%, ±2 ≈43%, ±3 ≈12% (rare). Power cards ≈6% when on.
function randCard(){
  if(S.power&&Math.random()<0.06)return Math.random()<0.5?'x2':'bomb';
  const p=Math.random()*100;
  if(S.threes){if(p<25)return 1;if(p<45)return -1;if(p<69)return 2;if(p<88)return -2;if(p<94)return 3;return -3;}
  if(p<29)return 1;if(p<52)return -1;if(p<79)return 2;return -2;
}

function flood(grid,r,c,val,vis){
  const stack=[[r,c]],grp=[];
  while(stack.length){const[rr,cc]=stack.pop(),k=rr*GS+cc;if(vis.has(k))continue;vis.add(k);grp.push([rr,cc]);for(const[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){const nr=rr+dr,nc=cc+dc;if(nr>=0&&nr<GS&&nc>=0&&nc<GS&&grid[nr][nc]===val&&!vis.has(nr*GS+nc))stack.push([nr,nc]);}}
  return grp;
}
function hasMerge(g){const vis=new Set();for(let r=0;r<GS;r++)for(let c=0;c<GS;c++){if(vis.has(r*GS+c))continue;if(flood(g,r,c,g[r][c],vis).length>=3)return true;}return false;}
function makeGrid(){let g;do{g=Array.from({length:GS},()=>Array.from({length:GS},()=>Math.floor(Math.random()*5)+1));}while(hasMerge(g));return g;}

function mergeOnce(grid,maxN){
  const vis=new Set(),merges=[];
  for(let r=0;r<GS;r++)for(let c=0;c<GS;c++){const k=r*GS+c;if(vis.has(k))continue;const v=grid[r][c];if(v===0){vis.add(k);continue;}const grp=flood(grid,r,c,v,vis);if(grp.length>=3)merges.push({v,grp:grp.sort((a,b)=>a[0]-b[0]||a[1]-b[1])});}
  if(!merges.length)return null;
  const ng=grid.map(r=>[...r]);let newMax=maxN,info=[];
  for(const{v,grp}of merges){const[r0,c0]=grp[0],nv=v+1;ng[r0][c0]=nv;if(nv>newMax)newMax=nv;for(const[rr,cc]of grp)if(rr!==r0||cc!==c0)ng[rr][cc]=0;info.push({nv,grp,winner:[r0,c0]});}
  return{grid:ng,info,maxN:newMax};
}
function gravity(grid){const g=grid.map(r=>[...r]);for(let c=0;c<GS;c++){const s=[];for(let r=0;r<GS;r++)if(g[r][c]!==0)s.push(g[r][c]);for(let r=GS-1;r>=0;r--)g[r][c]=s.length?s.pop():0;}return g;}
function refill(grid,maxN){const ng=grid.map(r=>[...r]),sp=new Set();for(let r=0;r<GS;r++)for(let c=0;c<GS;c++)if(ng[r][c]===0){ng[r][c]=Math.floor(Math.random()*maxN)+1;sp.add(r*GS+c);}return{grid:ng,spawned:sp};}

function applyCard(grid,r,c,card,mx){
  const g=grid.map(x=>[...x]);
  if(card==='bomb'){for(const[dr,dc]of[[0,0],[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<GS&&nc>=0&&nc<GS)g[nr][nc]=0;}}
  else if(card==='x2'){g[r][c]=Math.min(g[r][c]*2,mx+1);}
  else{const v=g[r][c]+card;g[r][c]=v<1?0:v;}
  return g;
}
function hasZero(g){return g.some(row=>row.includes(0));}
// Score: new number × tiles × 10; groups of 4+ get +50% per extra tile; combo chain step multiplies
function scoreMerge(nv,sz,step){let s=nv*sz*10;if(sz>3)s=Math.round(s*(1+0.5*(sz-3)));return S.combos?s*step:s;}

let grid=makeGrid(),maxN=5,turn=0,busy=false,gameOver=false,mode=2,players=[],undoSnap=null,undoUsed=false,gen=0,gameDiff='medium',gameLen=9;
function isCPU(){return mode===1&&turn%2===1&&!gameOver;}
function newHand(){return Array.from({length:gameLen},randCard);}

function buildCell(v,cls,clickable,r,c){
  const pal=gp(v),div=document.createElement("div");
  div.className="cell"+(cls?" "+cls:"");
  div.style.cssText=`background:${v===0?"rgba(255,255,255,.03)":pal.bg};border:1px solid ${v===0?"rgba(255,255,255,.05)":pal.glow+"44"};color:${v===0?"transparent":pal.text};box-shadow:${v>0?`0 0 14px ${pal.glow}77,0 2px 8px rgba(0,0,0,.5)`:"none"};font-size:${v>=10?"18px":"22px"};`;
  if(v>0){const sh=document.createElement("div");sh.className="shine";div.appendChild(sh);div.appendChild(document.createTextNode(v));}
  if(clickable&&v>0)div.addEventListener("click",()=>handleClick(r,c));
  return div;
}

function renderGrid(mergeKeys=null,winKeys=null,fallingKeys=null,dropKeys=null){
  const el=document.getElementById("grid");el.innerHTML="";
  const ok=!busy&&!gameOver&&!isCPU();
  for(let r=0;r<GS;r++)for(let c=0;c<GS;c++){
    const v=grid[r][c],k=r*GS+c;
    let cls="";
    if(mergeKeys&&mergeKeys.has(k)&&!(winKeys&&winKeys.has(k)))cls="merging";
    else if(winKeys&&winKeys.has(k))cls="merge-winner";
    else if(fallingKeys&&fallingKeys.has(k))cls="falling";
    else if(dropKeys&&dropKeys.has(k))cls="dropping";
    el.appendChild(buildCell(v,cls,ok,r,c));
  }
}


function renderPlayers(){
  document.getElementById("players").innerHTML=players.map((p,i)=>{
    const a=i===(turn%2)&&!gameOver;
    const th=p.tiles.map((t,ti)=>{const l=cl(t),mc=MC[l]||"#fff",nx=ti===0&&a;return`<div class="htile${nx?" next":""}" style="background:${nx?mc+"22":"rgba(255,255,255,.04)"};border:1.5px solid ${nx?mc:"rgba(255,255,255,.15)"};color:${nx?mc:"#ffffffbb"};box-shadow:${nx?`0 0 8px ${mc}88`:"none"};">${l}</div>`;}).join("");
    return`<div class="player ${a?"active":"inactive"}"><div class="phead"><span class="pname">${p.name}${a?" ▶":""}</span><span class="pbest">BEST ${p.bestTile}</span></div><div class="pscore">${p.score.toLocaleString()}</div><div class="hand">${th}${!p.tiles.length?'<span style="font-size:10px;color:#ffffffbb">empty</span>':""}</div></div>`;
  }).join("");
}
function winnerName(){
  const[a,b]=players,k1=S.winBy==='score'?'score':'bestTile',k2=k1==='score'?'bestTile':'score';
  if(a[k1]!==b[k1])return a[k1]>b[k1]?a.name:b.name;
  if(a[k2]!==b[k2])return a[k2]>b[k2]?a.name:b.name;
  return"Tie";
}
function renderHint(){
  const el=document.getElementById("hint"),p=players[turn%2];
  if(gameOver){
    const w=winnerName();
    el.innerHTML=`<div><div class="gameover-title">${w==="Tie"?"🤝 TIE":w==="YOU"?"🏆 YOU WIN":"🏆 "+w+" WINS"}</div><div class="gameover-scores">${players.map(p=>p.name+" "+p.score.toLocaleString()).join(" | ")}</div><div class="gameover-scores">won by ${S.winBy==='score'?'score':'highest tile'}</div><button class="play-again" onclick="startGame(mode)">PLAY AGAIN</button><br/><button class="restart-btn" onclick="showMenu()">menu</button></div>`;
  }else{
    const m=p.tiles[0],l=m!=null?cl(m):"",mc=MC[l]||"#fff";
    const canUndo=mode===1&&undoSnap&&!undoUsed&&!isCPU();
    el.innerHTML=(p.tiles.length?`${isCPU()?"computer is thinking… ":"tap a tile to play "}<span class="modval" style="color:${mc};text-shadow:0 0 8px ${mc}">${l}</span>`:"no cards")+`<br/>${canUndo?'<button class="restart-btn undo" onclick="undo()">undo</button> ':''}<button class="restart-btn" onclick="showMenu()">menu</button>`;
  }
  document.getElementById("maxlabel").textContent="MAX "+maxN;
}
function showPop(txt,cls){const el=document.createElement("div");el.className=cls||"score-pop";el.textContent=txt;document.body.appendChild(el);setTimeout(()=>el.remove(),1100);}

// Sound + vibration
let AC=null;
function tone(f,d,type,vol,delay){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
function buzz(ms){if(S.buzz&&navigator.vibrate)try{navigator.vibrate(ms);}catch(e){}}
const sfx={
  tap(){tone(520,.07,"square",.05);buzz(10);},
  merge(step){tone(440*Math.pow(1.19,step-1),.2,"triangle",.14);if(step>1)tone(660*Math.pow(1.19,step-1),.2,"triangle",.08,.06);buzz(15+12*step);},
  bomb(){tone(110,.4,"sawtooth",.18);tone(70,.5,"square",.08,.05);buzz(120);},
  power(){tone(700,.12,"sine",.12);tone(1050,.18,"sine",.1,.08);buzz(30);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",.13,i*.12));buzz(200);},
  lose(){[392,330,262].forEach((f,i)=>tone(f,.3,"sine",.12,i*.15));}
};

async function handleClick(r,c,fromCPU){
  if(busy||gameOver)return;
  if(isCPU()&&!fromCPU)return;
  const ci=turn%2,player=players[ci];
  if(!player.tiles.length)return;
  const myGen=gen,w=async ms=>{await sleep(ms);if(myGen!==gen)throw"stale";};
  if(mode===1&&!fromCPU&&!undoUsed)undoSnap=JSON.stringify({grid,maxN,turn,players});
  busy=true;
  try{
  const card=player.tiles[0];
  let curMax=maxN,pts=0,mergeCount=0,newBest=player.bestTile;
  if(card==='bomb'){sfx.bomb();showPop("BOOM!","callout");}else if(card==='x2')sfx.power();else sfx.tap();
  grid=applyCard(grid,r,c,card,maxN);
  if(hasZero(grid)){
    renderGrid();await w(150);
    const preG=grid.map(r=>[...r]);grid=gravity(grid);
    const dropK=new Set();
    for(let col=0;col<GS;col++)for(let row=0;row<GS;row++)if(grid[row][col]!==0&&preG[row][col]===0)dropK.add(row*GS+col);
    renderGrid(null,null,null,dropK);await w(260);
    const{grid:filled,spawned}=refill(grid,curMax);grid=filled;
    renderGrid(null,null,spawned);await w(440);
  }
  renderGrid();await w(90);
  let step=0;
  while(true){
    const res=mergeOnce(grid,curMax);if(!res)break;step++;
    const mKeys=new Set(),wKeys=new Set();
    for(const{grp,winner}of res.info){for(const[rr,cc]of grp)mKeys.add(rr*GS+cc);wKeys.add(winner[0]*GS+winner[1]);}
    renderGrid(mKeys,null);await w(320);
    for(const{nv,grp}of res.info){pts+=scoreMerge(nv,grp.length,step);mergeCount++;if(nv>newBest)newBest=nv;}
    sfx.merge(step);if(step>=2&&S.combos)showPop("COMBO ×"+step,"callout");
    curMax=res.maxN;grid=res.grid;
    renderGrid(null,wKeys);await w(380);
    const preG=grid.map(r=>[...r]);grid=gravity(grid);
    const dropK=new Set();
    for(let col=0;col<GS;col++)for(let row=0;row<GS;row++)if(grid[row][col]!==0&&preG[row][col]===0)dropK.add(row*GS+col);
    renderGrid(null,null,null,dropK);await w(260);
    const{grid:filled,spawned}=refill(grid,curMax);grid=filled;
    renderGrid(null,null,spawned);await w(440);
    renderGrid();await w(80);
  }
  if(pts>0)showPop("+"+pts.toLocaleString());
  maxN=curMax;
  players=players.map((p,i)=>{if(i!==ci)return p;const t=p.tiles.slice(1);for(let k=0;k<mergeCount&&t.length<gameLen;k++)t.push(randCard());return{...p,score:p.score+pts,tiles:t,bestTile:newBest};});
  if(!players[0].tiles.length&&!players[1].tiles.length){gameOver=true;finishGame();}
  else{turn++;if(!players[turn%2].tiles.length)turn++;}
  }catch(e){return;}
  busy=false;
  renderPlayers();renderGrid();renderHint();
  if(isCPU())cpuMove();
}
function finishGame(){
  const w=winnerName();
  if(mode===1){ST.best1p=Math.max(ST.best1p,players[0].score);if(w==="YOU")ST[gameDiff][0]++;else if(w==="CPU")ST[gameDiff][1]++;save('mg_stats',ST);}
  if(mode===1&&w==="CPU")sfx.lose();else sfx.win();
}
function undo(){
  if(busy||!undoSnap||undoUsed||gameOver)return;
  const s=JSON.parse(undoSnap);grid=s.grid;maxN=s.maxN;turn=s.turn;players=s.players;
  undoUsed=true;undoSnap=null;gen++;sfx.tap();
  renderPlayers();renderGrid();renderHint();
}

// Computer player
function evalMove(g0,r,c,card,mx){
  let g=applyCard(g0,r,c,card,mx),pts=0,best=0,n=0,step=0;
  if(hasZero(g))g=gravity(g);
  for(;;){const res=mergeOnce(g,mx);if(!res)break;step++;
    for(const{nv,grp}of res.info){pts+=scoreMerge(nv,grp.length,step);n++;if(nv>best)best=nv;}
    mx=res.maxN;g=gravity(res.grid);}
  return pts+n*25+best*(S.winBy==='tile'?60:15);
}
async function cpuMove(){
  const my=gen;await sleep(700);
  if(my!==gen||!isCPU()||busy)return;
  const card=players[1].tiles[0],opts=[];
  for(let r=0;r<GS;r++)for(let c=0;c<GS;c++)if(grid[r][c])opts.push({r,c,s:evalMove(grid,r,c,card,maxN)+Math.random()*5});
  opts.sort((a,b)=>b.s-a.s);
  const any=n=>opts[Math.floor(Math.random()*Math.min(n,opts.length))];
  let pick=opts[0];
  if(gameDiff==='medium')pick=any(3);
  if(gameDiff==='easy')pick=Math.random()<.5?any(opts.length):any(6);
  const cell=document.getElementById("grid").children[pick.r*GS+pick.c];if(cell)cell.style.outline="3px solid #fff";
  await sleep(350);if(my!==gen)return;
  handleClick(pick.r,pick.c,true);
}

// Menus
function hideAll(){for(const id of["menu","how","settings"])document.getElementById(id).hidden=true;}
function chip(k,v,label){return`<button class="chip${S[k]===v?" on":""}" data-k="${k}" data-v='${JSON.stringify(v)}'>${label}</button>`;}
function showMenu(){
  gen++;busy=false;hideAll();const d=S.diff,rec=ST[d]||[0,0],el=document.getElementById("menu");el.hidden=false;
  el.innerHTML=`<h2>MERGE GRID</h2>
  <button class="big" onclick="startGame(1)">1 PLAYER<div class="sub">YOU vs COMPUTER</div></button>
  <div class="srow">${chip('diff','easy','EASY')}${chip('diff','medium','MEDIUM')}${chip('diff','hard','HARD')}</div>
  <button class="big p2" onclick="startGame(2)">2 PLAYERS<div class="sub">PASS THE PHONE</div></button>
  <div class="srow"><button class="small" onclick="showHow()">HOW TO PLAY</button><button class="small" onclick="showSettings()">SETTINGS</button></div>
  <div class="stats">BEST SCORE ${ST.best1p.toLocaleString()}<br/>vs CPU (${d.toUpperCase()}): ${rec[0]} WIN${rec[0]===1?'':'S'} · ${rec[1]} LOSS${rec[1]===1?'':'ES'}</div>`;
}
function showSettings(){
  hideAll();const el=document.getElementById("settings");el.hidden=false;
  const row=(t,h)=>`<div class="slabel">${t}</div><div class="srow">${h}</div>`;
  el.innerHTML=`<h2>SETTINGS</h2>`+
  row("WIN BY",chip('winBy','score','SCORE')+chip('winBy','tile','HIGHEST TILE'))+
  row("COMBO BONUS",chip('combos',true,'ON')+chip('combos',false,'OFF'))+
  row("GAME LENGTH (CARDS)",chip('length',6,'SHORT 6')+chip('length',9,'NORMAL 9')+chip('length',12,'LONG 12'))+
  row("±3 CARDS",chip('threes',true,'ON')+chip('threes',false,'OFF'))+
  row("POWER CARDS ×2 💣",chip('power',true,'ON')+chip('power',false,'OFF'))+
  row("SOUND",chip('sound',true,'ON')+chip('sound',false,'OFF'))+
  row("VIBRATE",chip('buzz',true,'ON')+chip('buzz',false,'OFF'))+
  `<button class="small" onclick="showMenu()">BACK</button>`;
}
function showHow(){
  hideAll();const el=document.getElementById("how");el.hidden=false;
  const t=v=>`<span class="mini" style="background:${gp(v).bg};color:${gp(v).text}">${v}</span>`;
  el.innerHTML=`<h2>HOW TO PLAY</h2><div class="howto">
  <p><b>1.</b> On your turn, tap any tile. Your next card (the glowing one) gets added to it: ${t(3)} with <b style="color:#00D4FF">+2</b> becomes ${t(5)}</p>
  <p><b>2.</b> Three or more of the same number touching (side-by-side or up-and-down) merge into one tile, one number higher: ${t(4)}${t(4)}${t(4)} → ${t(5)}</p>
  <p><b>3.</b> New tiles drop in from the top. If they make more matches, that's a <b style="color:#E040FB">COMBO</b>. Each step of the chain scores more.</p>
  <p><b>4.</b> Every merge earns you a new card. The game ends when both players run out of cards.</p>
  <p><b>5.</b> Bigger groups and higher numbers score more. Most points wins (switch to highest tile in Settings).</p>
  <p><b style="color:#FFD23F">POWER CARDS:</b> <b style="color:#E040FB">×2</b> doubles a tile. <b style="color:#FF9500">💣</b> blasts a tile and the 4 around it.</p>
  <p><b style="color:#FFD23F">UNDO:</b> In 1-player games you get one undo per game.</p></div>
  <button class="small" onclick="showMenu()">BACK</button>`;
}
document.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;S[b.dataset.k]=JSON.parse(b.dataset.v);save('mg_settings',S);sfx.tap();if(!document.getElementById("settings").hidden)showSettings();else showMenu();});
function startGame(m){
  mode=m;gameLen=S.length;gameDiff=S.diff;grid=makeGrid();maxN=5;turn=0;busy=false;gameOver=false;undoSnap=null;undoUsed=false;gen++;
  const n=m===1?["YOU","CPU"]:["P1","P2"];
  players=n.map(name=>({name,score:0,tiles:newHand(),bestTile:0}));
  hideAll();renderPlayers();renderGrid();renderHint();
}
startGame(2);showMenu();
</script>
